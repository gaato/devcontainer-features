name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Installs resolve upstream latest and nightly at build time, so catch
  # upstream changes even when this repository is quiet.
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autogenerated:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        baseImage:
          - debian:trixie
          - ubuntu:24.04
          - fedora:43
          - opensuse/tumbleweed
          - mcr.microsoft.com/devcontainers/base:ubuntu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the devcontainer CLI pinned in mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: devcontainer features test --skip-scenarios -f moonbit -i "$BASE_IMAGE" .
        env:
          BASE_IMAGE: ${{ matrix.baseImage }}

  scenarios:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the devcontainer CLI pinned in mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: devcontainer features test -f moonbit --skip-autogenerated --skip-duplicated .
